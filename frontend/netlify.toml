[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"
Content-Type = "application/javascript"

[[headers]]
for = "/manifest.webmanifest"
[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"
Content-Type = "application/manifest+json"

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"